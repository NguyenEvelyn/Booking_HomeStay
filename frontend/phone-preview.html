<!doctype html>
<!-- Dev-only phone frame around the running app (like an iOS Simulator window). Open
     http://localhost:5173/phone-preview.html while `npm run dev` runs. Not part of the production
     build: Vite only bundles index.html. -->
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Tripio – Xem trên điện thoại</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: radial-gradient(circle at 50% 30%, #2b3446, #11151d 70%);
      color: #e8ecf3; font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
      display: flex; flex-direction: column; overflow: hidden;
    }
    .toolbar {
      display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center;
      padding: 10px 16px; background: rgba(0, 0, 0, .35); border-bottom: 1px solid rgba(255, 255, 255, .08);
    }
    .toolbar .title { font-weight: 600; margin-right: 8px; }
    .toolbar select, .toolbar button {
      background: #232a37; color: inherit; border: 1px solid #3a4456; border-radius: 8px;
      padding: 6px 10px; font: inherit; cursor: pointer;
    }
    .toolbar button:hover, .toolbar select:hover { border-color: #6b7a93; }
    .toolbar .size { color: #94a0b4; font-variant-numeric: tabular-nums; }
    .stage { flex: 1; display: grid; place-items: center; padding: 20px; min-height: 0; }
    .holder { position: relative; }
    .device {
      position: absolute; top: 0; left: 0; transform-origin: top left;
      background: #0d0d0f; padding: var(--bezel); border-radius: var(--outer-radius);
      box-shadow: 0 0 0 2px #3b3d44, 0 0 0 4px #1b1c20, 0 30px 80px rgba(0, 0, 0, .6);
    }
    .screen {
      position: relative; overflow: hidden; background: #fff;
      border-radius: var(--screen-radius); display: flex; flex-direction: column;
    }
    .statusbar {
      flex: none; height: var(--status-h); display: flex; align-items: center; justify-content: space-between;
      padding: 0 var(--status-pad); color: #000; font-weight: 600; font-size: 15px; background: #fff;
    }
    .statusbar .icons { display: flex; gap: 6px; align-items: center; }
    iframe { flex: 1; width: 100%; border: 0; display: block; background: #fff; }
    .island {
      position: absolute; top: 11px; left: 50%; transform: translateX(-50%);
      width: 125px; height: 36px; border-radius: 20px; background: #000; z-index: 2;
    }
    .punch {
      position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
      width: 14px; height: 14px; border-radius: 50%; background: #000; z-index: 2;
    }
    .home {
      position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
      width: 134px; height: 5px; border-radius: 3px; background: rgba(0, 0, 0, .75);
      z-index: 2; pointer-events: none;
    }
    .landscape .statusbar { display: none; }
    .landscape .island { top: 50%; left: 11px; transform: translateY(-50%); width: 36px; height: 125px; }
    .landscape .punch { top: 50%; left: 10px; transform: translateY(-50%); }
    .hint { text-align: center; color: #7d899c; font-size: 12px; padding: 0 16px 10px; }
  </style>
</head>
<body>
  <div class="toolbar">
    <span class="title">📱 Tripio – Xem trên điện thoại</span>
    <select id="source" aria-label="Chọn ứng dụng">
      <option value="/">Web (Vite :5173)</option>
      <option value="http://localhost:8081">App mobile (Expo :8081)</option>
    </select>
    <select id="device" aria-label="Chọn thiết bị"></select>
    <select id="zoom" aria-label="Thu phóng">
      <option value="fit">Vừa màn hình</option>
      <option value="1">100%</option>
      <option value="0.75">75%</option>
      <option value="0.5">50%</option>
    </select>
    <button id="rotate" type="button">⟳ Xoay ngang/dọc</button>
    <button id="reload" type="button">↻ Tải lại</button>
    <span class="size" id="size"></span>
  </div>
  <div class="stage"><div class="holder" id="holder">
    <div class="device" id="frame">
      <div class="screen" id="screen">
        <div class="statusbar">
          <span id="clock">9:41</span>
          <span class="icons" aria-hidden="true">
            <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2.5" width="3" height="9.5" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
            <svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 11.5 5.6 9a3.4 3.4 0 0 1 4.8 0zM3.4 6.8a6.5 6.5 0 0 1 9.2 0l-1.5 1.5a4.4 4.4 0 0 0-6.2 0zM1.2 4.6a9.6 9.6 0 0 1 13.6 0l-1.5 1.5a7.5 7.5 0 0 0-10.6 0z"/></svg>
            <svg width="26" height="12" viewBox="0 0 26 12"><rect x=".5" y=".5" width="22" height="11" rx="3" fill="none" stroke="#000" opacity=".4"/><rect x="2" y="2" width="17" height="8" rx="1.8"/><rect x="23.5" y="4" width="1.8" height="4" rx=".9" opacity=".4"/></svg>
          </span>
        </div>
        <iframe id="app" title="Tripio"></iframe>
        <div id="cutout"></div>
        <div class="home" id="home"></div>
      </div>
    </div>
  </div></div>
  <div class="hint">Sửa code là khung tự cập nhật. Cửa sổ này đặt cạnh VS Code giống Simulator.</div>

  <script>
    // Viewport sizes in CSS pixels, as reported by the real devices.
    const devices = {
      'iphone-15-pro': { label: 'iPhone 15 Pro', w: 393, h: 852, kind: 'ios' },
      'iphone-15-pro-max': { label: 'iPhone 15 Pro Max', w: 430, h: 932, kind: 'ios' },
      'iphone-se': { label: 'iPhone SE', w: 375, h: 667, kind: 'ios-classic' },
      'pixel-7': { label: 'Google Pixel 7', w: 412, h: 915, kind: 'android' },
      'galaxy-s23': { label: 'Samsung Galaxy S23', w: 360, h: 780, kind: 'android' }
    };
    const styles = {
      ios: { bezel: 12, outer: 56, screen: 46, status: 54, statusPad: 32, cutout: 'island', home: true },
      'ios-classic': { bezel: 14, outer: 40, screen: 6, status: 20, statusPad: 10, cutout: null, home: false },
      android: { bezel: 10, outer: 40, screen: 30, status: 32, statusPad: 22, cutout: 'punch', home: false }
    };

    const $ = id => document.getElementById(id);
    const read = (key, fallback) => { try { return localStorage.getItem(key) ?? fallback; } catch { return fallback; } };
    const save = (key, value) => { try { localStorage.setItem(key, value); } catch { /* private mode */ } };

    let state = { device: read('phone-preview.device', 'iphone-15-pro'), zoom: read('phone-preview.zoom', 'fit'), landscape: read('phone-preview.landscape', '0') === '1' };
    if (!devices[state.device]) state.device = 'iphone-15-pro';

    for (const [id, d] of Object.entries(devices)) $('device').add(new Option(`${d.label} (${d.w}×${d.h})`, id));
    $('device').value = state.device;
    $('zoom').value = state.zoom;

    // ?app=expo opens the Expo app directly.
    const sources = [...$('source').options].map(o => o.value);
    const fromQuery = new URLSearchParams(location.search).get('app') === 'expo' ? 'http://localhost:8081' : null;
    let source = fromQuery || read('phone-preview.source', '/');
    if (!sources.includes(source)) source = '/';
    $('source').value = source;
    $('app').src = source;
    $('source').onchange = e => { save('phone-preview.source', e.target.value); $('app').src = e.target.value; };

    function render() {
      const d = devices[state.device], s = styles[d.kind];
      const w = state.landscape ? d.h : d.w, h = state.landscape ? d.w : d.h;
      const frame = $('frame'), screen = $('screen');
      frame.style.setProperty('--bezel', `${s.bezel}px`);
      frame.style.setProperty('--outer-radius', `${s.outer}px`);
      frame.style.setProperty('--screen-radius', `${s.screen}px`);
      frame.style.setProperty('--status-h', `${s.status}px`);
      frame.style.setProperty('--status-pad', `${s.statusPad}px`);
      frame.classList.toggle('landscape', state.landscape);
      screen.style.width = `${w}px`;
      screen.style.height = `${h}px`;
      $('cutout').className = s.cutout ?? '';
      $('home').style.display = s.home ? '' : 'none';

      const frameW = w + s.bezel * 2, frameH = h + s.bezel * 2;
      const stage = document.querySelector('.stage');
      const fit = Math.min(1, (stage.clientWidth - 40) / frameW, (stage.clientHeight - 40) / frameH);
      const scale = state.zoom === 'fit' ? fit : Number(state.zoom);
      frame.style.transform = `scale(${scale})`;
      $('holder').style.width = `${frameW * scale}px`;
      $('holder').style.height = `${frameH * scale}px`;
      $('size').textContent = `${w}×${h} · ${Math.round(scale * 100)}%`;
    }

    $('device').onchange = e => { state.device = e.target.value; save('phone-preview.device', state.device); render(); };
    $('zoom').onchange = e => { state.zoom = e.target.value; save('phone-preview.zoom', state.zoom); render(); };
    $('rotate').onclick = () => { state.landscape = !state.landscape; save('phone-preview.landscape', state.landscape ? '1' : '0'); render(); };
    // Reassigning src also works for the cross-origin Expo app, where contentWindow.location is off-limits.
    $('reload').onclick = () => { $('app').src = $('app').src; };
    window.addEventListener('resize', render);

    const tick = () => { const n = new Date(); $('clock').textContent = `${n.getHours()}:${String(n.getMinutes()).padStart(2, '0')}`; };
    tick(); setInterval(tick, 15000);
    render();
  </script>
</body>
</html>
